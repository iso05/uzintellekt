name: 🚀 Build & Deploy to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: uz-intellekt → /www/main
  # ─────────────────────────────────────────────
  deploy-main:
    name: 🌐 uz-intellekt → /www/main
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: uz-intellekt/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./uz-intellekt
        run: npm ci

      - name: 🏗️ Build
        working-directory: ./uz-intellekt
        run: npm run build
        env:
          # .env faylidagi o'zgaruvchilar kerak bo'lsa Secrets ga qo'shing
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 📤 rsync dist → /www/main
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=no" \
            uz-intellekt/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/www/main/
        # --delete: eski kerak bo'lmagan fayllarni o'chiradi
        # NGINX KONFIGURATSIYASIGA TEGMAYDI!

  # ─────────────────────────────────────────────
  # JOB 2: dashboard → /www/dashboard
  # ─────────────────────────────────────────────
  deploy-dashboard:
    name: 📊 dashboard → /www/dashboard
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 Install dependencies (root workspaces)
        run: npm ci

      - name: 🏗️ Build
        run: npm run build -w dashboard

      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 📤 rsync dist → /www/dashboard
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=no" \
            dashboard/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/www/dashboard/
        # NGINX KONFIGURATSIYASIGA TEGMAYDI!

  # ─────────────────────────────────────────────
  # JOB 3: admin → /www/admin
  # ─────────────────────────────────────────────
  deploy-admin:
    name: 🛠️ admin → /www/admin
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 Install dependencies (root workspaces)
        run: npm ci

      - name: 🏗️ Build
        run: npm run build -w admin

      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 📤 rsync dist → /www/admin
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=no" \
            admin/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/www/admin/
        # NGINX KONFIGURATSIYASIGA TEGMAYDI!
