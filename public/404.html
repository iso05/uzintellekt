<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>UzIntellekt</title>
    <script>
      // GitHub Pages SPA fix — sahifa yangilanganda to'g'ri route ga qaytaradi
      var segmentCount = 1; // repo subdirectory uchun 1, root domain uchun 0
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
