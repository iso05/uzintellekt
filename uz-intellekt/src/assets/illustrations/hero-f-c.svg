<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hero F (©) — shield with copyright symbol embracing documents">
  <defs>
    <linearGradient id="hfc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf2fd"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="hfc-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7adb"/>
      <stop offset="1" stop-color="#1f5cc7"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="400" height="400" rx="32" fill="url(#hfc-bg)"/>

  <!-- soft glow -->
  <circle cx="200" cy="200" r="130" fill="#1f5cc7" opacity="0.07"/>

  <!-- doc peeking from LEFT (behind shield) -->
  <g transform="translate(60 150) rotate(-14)">
    <rect x="0" y="0" width="100" height="130" rx="10" fill="#ffffff" stroke="#e1e7ee" stroke-width="1.5"/>
    <rect x="14" y="20" width="60" height="6" rx="3" fill="#1f5cc7"/>
    <rect x="14" y="36" width="72" height="5" rx="2.5" fill="#e1e7ee"/>
    <rect x="14" y="48" width="56" height="5" rx="2.5" fill="#e1e7ee"/>
    <rect x="14" y="60" width="64" height="5" rx="2.5" fill="#e1e7ee"/>
    <rect x="14" y="72" width="44" height="5" rx="2.5" fill="#e1e7ee"/>
    <circle cx="80" cy="105" r="11" fill="#f59e0b"/>
    <path d="M75 105 l4 4 l7 -7" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- doc peeking from RIGHT (behind shield) -->
  <g transform="translate(240 150) rotate(14)">
    <rect x="0" y="0" width="100" height="130" rx="10" fill="#ffffff" stroke="#e1e7ee" stroke-width="1.5"/>
    <rect x="14" y="20" width="56" height="6" rx="3" fill="#1f5cc7"/>
    <rect x="14" y="36" width="72" height="5" rx="2.5" fill="#e1e7ee"/>
    <rect x="14" y="48" width="60" height="5" rx="2.5" fill="#e1e7ee"/>
    <rect x="14" y="60" width="68" height="5" rx="2.5" fill="#e1e7ee"/>
    <rect x="14" y="72" width="50" height="5" rx="2.5" fill="#e1e7ee"/>
  </g>

  <!-- shadow under shield -->
  <ellipse cx="200" cy="320" rx="80" ry="8" fill="#1f5cc7" opacity="0.15"/>

  <!-- SHIELD with © symbol -->
  <g transform="translate(122 130) scale(1.3)">
    <path d="M60 0 L120 22 L120 88 C120 120 96 138 60 148 C24 138 0 120 0 88 L0 22 Z"
          fill="url(#hfc-shield)"/>
    <path d="M60 10 L110 28 L110 86 C110 112 88 128 60 136 C32 128 10 112 10 86 L10 28 Z"
          fill="none" stroke="#ffffff" stroke-width="1" opacity="0.22"/>
    <!-- © drawn as paths for crisp rendering -->
    <g stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- outer circle -->
      <circle cx="60" cy="78" r="30"/>
      <!-- inner C: arc opening to the right (~270deg) -->
      <path d="M73 66 a18 18 0 1 0 0 24"/>
    </g>
  </g>

  <!-- accent dots -->
  <circle cx="80" cy="100" r="5" fill="#f59e0b"/>
  <circle cx="340" cy="320" r="4" fill="#1f5cc7" opacity="0.4"/>
</svg>
